[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kylin-memory-bench"
version = "0.2.0"
description = "Evidence-based long-term memory benchmark for openKylin agents"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
kmb = "kylin_memory_bench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kylin_memory_bench*"]
